name: update readme cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Action ini dipin ke commit SHA, bukan ke tag. Tag bisa dipindahin
      # pemiliknya kapan aja; SHA nggak. Repo-nya juga sempat ganti nama dari
      # readme-tools/ ke stats-organization/, jadi kita pakai nama kanonik
      # yang sekarang. Angka di komentar cuma penanda versi buat manusia.
      - name: stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # include_all_commits=true itu WAJIB buat kamu. Tanpa itu, kartunya
          # cuma ngitung commit tahun kalender ini, dan angkamu di 2026 masih
          # nyaris nol. Dengan itu, keliatan 353 commit sepanjang waktu.
          # hide=issues,stars nyembunyiin dua angka terlemah (0 issue, 1 star).
          # hide_rank=true ngilangin huruf peringkat. Hapus salah satu kalau
          # kamu mau nampilin apa adanya.
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=issues,stars&hide_rank=true&theme=transparent

      - name: top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # exclude_repo ngeluarin repo yang ngaco-in gambaran bahasa:
          #   Dasar_Pengolahan-Citra-Digital + Genetic-Algorithms-Example
          #     -> dua tugas kampus, bikin Jupyter Notebook jadi 69,55%
          #   pkl -> tugas sekolah Laravel; tanpa dibuang, Blade naik ke 29,3%
          # Setelah ketiganya dibuang, JavaScript jadi ~65,8%, yang jauh lebih
          # mewakili kerjaan kamu sekarang. Mau salah satu dibalikin? Hapus aja
          # namanya dari daftar di bawah.
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent&exclude_repo=Dasar_Pengolahan-Citra-Digital,Genetic-Algorithms-Example,pkl

      - name: commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "update readme cards"
          git push
